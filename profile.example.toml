# ──────────────────────────────────────────────────────────────
#  Copy this file to `profile.toml` and make it yours.
#  `profile.toml` is gitignored (it holds your name, email, etc.).
#
#  This single file drives the entire scoring engine: what counts
#  as a match, which tier a job lands in, and what the AI compares
#  each job description against.
# ──────────────────────────────────────────────────────────────

name = "Ada Lovelace"

# The paragraph the LLM reads to judge fit. Write it about who you
# are and what you want — a couple of honest sentences beat a
# keyword dump.
bio = """
Backend engineer with a data/ML background, comfortable across the
stack. Looking for backend, platform, or ML-engineering roles at
climate, health, or developer-tools companies. Prefer remote.
"""

# The roles you're actively searching for. Strongest signal —
# matched against job titles.
target_roles = [
    "backend engineer",
    "platform engineer",
    "software engineer",
    "ml engineer",
    "data engineer",
]

# Domains you care about (a moderate positive signal).
interests = ["climate", "developer tools", "health tech", "data infrastructure"]

# Skills come in three tiers. Put a skill where it reflects how much it
# sets you apart, not how good you are at it — a skill every posting asks
# for can't tell a great-fit job from any other.
[skills]
# strong: rare, differentiating skills (high weight).
strong = ["rust", "kubernetes", "distributed systems"]
# medium: supporting skills that narrow the field (moderate weight).
medium = ["postgres", "typescript", "react", "graphql", "airflow"]
# common: generic skills in almost every tech job (low weight).
common = ["python", "aws", "docker", "git", "sql"]

[preferences]
# Preferred work modes; anything else is down-ranked by offmode_penalty.
work_modes = ["remote", "hybrid"]
# Onsite jobs: "penalize" (down-rank, default) or "hide" (always tier as skip).
onsite_mode = "penalize"
# Preferred regions (us, uk, emea, apac, canada, latam). Empty = no preference.
regions = ["us"]
# Phrases that strongly disqualify a role.
dealbreakers = ["security clearance", "on-call 24/7"]

# Optional: tune the point values. Defaults shown.
[weights]
target_role       = 12
strong_skill      = 10
medium_skill      = 4
common_skill      = 2
interest          = 6
dealbreaker       = -14
offmode_penalty   = -25
offregion_penalty = -4
title_multiplier  = 3    # a title match counts this many times (best 2 only)
desc_positive_cap = 12   # most the description's positive matches can add

# Optional: tune the score thresholds for each tier.
[tiers]
apply_now = 30
strong    = 16
maybe     = 6

# AI re-rank (needs GROQ_API_KEY). Groq retires models now and then — run
# `job_hunter doctor` to check this one is still available.
[llm]
enabled = true
model   = "openai/gpt-oss-120b"
# Fit-score (0-100) cutoffs for AI-reviewed jobs; only apply_now/strong are emailed.
tier_apply_now = 80
tier_strong    = 62
tier_maybe     = 40

[email]
enabled = true
# Resend's shared sandbox sender works out of the box; swap for your
# own verified domain to send from a custom address.
from = "onboarding@resend.dev"
to   = "you@example.com"
